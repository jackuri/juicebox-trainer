name: Release

# Builds the Windows installer for a version tag and publishes a GitHub release.
# Optional secrets (the release works without them):
#   WINDOWS_CERTIFICATE           base64 of a code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  its password
#   TAURI_SIGNING_PRIVATE_KEY     the updater key (signs update files)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   ANDROID_KEYSTORE              base64 of the phone app's signing keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD     its password (store and key)
# Without the Android keystore the phone app isn't added to the release (an unsigned APK can't
# be installed).
# In-app updates are switched on only when the repository is public and the
# updater key is set. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build scripts don't need the job's GitHub token.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG but package.json says $version" }

      - name: Install JS dependencies
        run: npm ci

      - name: Build AI helper
        run: npm run build:agent

      - name: Import the code-signing certificate (if there is one)
        id: cert
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT) { Write-Host "No certificate: the installer is not signed."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Release settings
        env:
          JB_PUBLIC: ${{ github.event.repository.private == false }}
          JB_HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          JB_CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: node scripts/release-config.mjs

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri --workspace @juicebox-trainer/desktop -- build --config ../../release.conf.json

      - name: Collect release files
        run: node scripts/release-files.mjs ${{ github.repository }}

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem release-out -Exclude notes.md | ForEach-Object { $_.FullName }
          # "Latest" (what the download page and the updater's latest.json point at) goes to the
          # highest version, even when several tags are released at once or an old one is redone.
          $mine = [version]$env:TAG.TrimStart('v')
          $newest = $true
          foreach ($t in (gh release list --limit 200 --json tagName --jq '.[].tagName')) {
            try { if ([version]$t.TrimStart('v') -gt $mine) { $newest = $false } } catch { }
          }
          gh release create $env:TAG $files --title "JuiceBox Trainer $env:TAG" --notes-file release-out/notes.md "--latest=$($newest.ToString().ToLower())"

  android:
    name: Phone app (signed APK)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Is there a signing key?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No Android keystore: the phone app isn't added."; echo "have=false" >> "$GITHUB_OUTPUT"; else echo "have=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        if: steps.key.outputs.have == 'true'
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v5
        if: steps.key.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain and the phone's targets
        if: steps.key.outputs.have == 'true'
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install JS dependencies
        if: steps.key.outputs.have == 'true'
        run: npm ci

      - name: Signing settings
        if: steps.key.outputs.have == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/remote.jks"
          {
            echo "storeFile=$RUNNER_TEMP/remote.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=juicebox-remote"
            echo "keyPassword=$PASSWORD"
          } > apps/mobile/src-tauri/gen/android/keystore.properties

      - name: "Build the APK (phones: arm64, arm; emulators: x86_64)"
        if: steps.key.outputs.have == 'true'
        working-directory: apps/mobile
        # The runner's newest NDK (a variable of the machine, not of the workflow).
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64 --target armv7 --target x86_64 --ci

      - name: Add it to the release
        if: steps.key.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          rm -f apps/mobile/src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/remote.jks"
          version="${TAG#v}"
          apk="JuiceBoxRemote_${version}.apk"
          cp apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          sha256sum "$apk" >> SHA256SUMS.txt
          gh release upload "$TAG" "$apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
