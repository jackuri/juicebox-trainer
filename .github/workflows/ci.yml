name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      # The Tauri crate embeds apps/desktop/dist, so build the web UI first.
      - name: Build web UI
        run: npm run build:web

      - name: Build AI helper
        run: npm run build:agent

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (x64)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (testbed x86, all features)
        run: cargo clippy -p testbed-native --target i686-pc-windows-msvc --all-features -- -D warnings

      - name: cargo test (includes testbed integration tests)
        run: cargo test --workspace

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test
