name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build scripts don't need the job's GitHub token.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      # The Tauri crates embed apps/desktop/dist and apps/mobile/dist, so build the web UIs first.
      - name: Build web UI
        run: npm run build:web

      - name: Build AI helper
        run: npm run build:agent

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (x64)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (testbed x86, all features)
        run: cargo clippy -p testbed-native --target i686-pc-windows-msvc --all-features -- -D warnings

      - name: cargo test (includes testbed integration tests)
        run: cargo test --workspace

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Website (build and link check)
        run: npm run site

  android:
    name: Phone app (Android build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain and the phone's targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      # Unsigned here (no key in CI checks); the release workflow signs it.
      - name: Build the APK
        working-directory: apps/mobile
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --apk --target aarch64 --ci
