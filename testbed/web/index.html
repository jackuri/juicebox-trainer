<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTrainer Web Testbed</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #14161f;
        color: #e8eaf2;
        margin: 2rem;
      }
      .stat {
        font-size: 1.4rem;
        margin: 0.4rem 0;
      }
      button {
        font-size: 1rem;
        margin: 0.3rem 0.3rem 0 0;
        padding: 0.4rem 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>OpenTrainer Web Testbed</h1>
    <p>A fake web game for testing OpenTrainer. Gold lives in a JavaScript object; health and ammo live in WebAssembly memory, like an emulator.</p>
    <p class="stat">Gold: <span id="gold">?</span></p>
    <p class="stat">Health: <span id="health">?</span></p>
    <p class="stat">Ammo: <span id="ammo">?</span></p>
    <button id="earn">Earn 25 gold</button>
    <button id="hit">Take a hit (-10 health)</button>
    <button id="shoot">Shoot (-1 ammo)</button>
    <script src="game.js"></script>
  </body>
</html>
