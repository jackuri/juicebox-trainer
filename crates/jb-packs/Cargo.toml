[package]
name = "jb-packs"
description = "Cheat pack schema, validator, store and the trainer runtime (value and patch ops)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "otpack"
path = "src/bin/juicepack.rs"

[dependencies]
jb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# zip turns flate2 default features off; this picks its pure-Rust backend.
flate2 = "1.1.11"
tracing.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21.2"

[dev-dependencies]
testbed-harness.workspace = true

[lints]
workspace = true
