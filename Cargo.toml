[workspace]
resolver = "3"
members = [
    "crates/jb-core",
    "crates/jb-packs",
    "crates/jb-saves",
    "crates/jb-mcp",
    "testbed/native",
    "testbed/harness",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.27.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["JuiceBox Trainer contributors"]
publish = false

[workspace.dependencies]
jb-core = { path = "crates/jb-core" }
jb-packs = { path = "crates/jb-packs" }
jb-saves = { path = "crates/jb-saves" }
jb-mcp = { path = "crates/jb-mcp" }
testbed-harness = { path = "testbed/harness" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Memory scans and the Unreal reader walk gigabytes; keep the core fast in
# development builds and tests too.
[profile.dev.package.jb-core]
opt-level = 3
