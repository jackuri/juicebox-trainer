[package]
name = "juicebox-trainer"
description = "JuiceBox Trainer desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "juicebox-trainer"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Same version jb-packs uses; makes the PNG of an exe icon (Games tab).
flate2 = "1.1.11"
jb-core.workspace = true
jb-mcp.workspace = true
jb-packs.workspace = true
jb-saves.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
base64 = "0.22.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
# No "zip" feature: our updates are the signed setup .exe (not the old .nsis.zip), and the
# zip crate it would pull in (4.x) has known extraction bugs.
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tracing.workspace = true
# Already used by Tauri itself (same version): lets JuiceBox Trainer notice when a page crashes
# or freezes (WebView2 ProcessFailed), v1.22.0.
webview2-com = "0.39.1"
tracing-subscriber.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
