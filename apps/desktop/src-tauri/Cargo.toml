[package]
name = "opentrainer-desktop"
description = "OpenTrainer desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "opentrainer-desktop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ot-core.workspace = true
ot-mcp.workspace = true
ot-packs.workspace = true
ot-saves.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
