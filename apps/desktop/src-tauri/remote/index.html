<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OpenTrainer remote</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #09090b; color: #e4e4e7; }
      header { position: sticky; top: 0; padding: 14px 16px; background: #18181b; border-bottom: 1px solid #27272a; }
      h1 { margin: 0; font-size: 17px; }
      #status { margin: 4px 0 0; font-size: 13px; color: #a1a1aa; }
      main { padding: 8px 16px 32px; }
      h2 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #71717a; }
      .row { display: flex; align-items: center; gap: 10px; padding: 12px; margin: 6px 0; border-radius: 10px; background: #18181b; }
      .name { flex: 1; min-width: 0; font-size: 15px; }
      .msg { display: block; font-size: 12px; color: #f87171; margin-top: 2px; }
      button { font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 10px 14px; background: #3f3f46; color: #fafafa; }
      button.on { background: #059669; }
      button:disabled { opacity: .4; }
      input { font: inherit; width: 96px; padding: 9px; border-radius: 8px; border: 1px solid #3f3f46; background: #09090b; color: #fafafa; }
      .empty { margin-top: 32px; color: #a1a1aa; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="game">OpenTrainer</h1>
      <p id="status">Connecting…</p>
    </header>
    <main id="cheats"></main>
    <script src="/app.js"></script>
  </body>
</html>
