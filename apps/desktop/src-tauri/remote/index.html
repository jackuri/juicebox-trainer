<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>JuiceBox Trainer remote</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0e111a; color: #eceef6; }
      header { position: sticky; top: 0; padding: 14px 16px; background: #171b28; border-bottom: 1px solid #242a3b; }
      h1 { margin: 0; font-size: 17px; }
      #status { margin: 4px 0 0; font-size: 13px; color: #8c93ab; }
      main { padding: 8px 16px 32px; }
      h2 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #69708a; }
      .row { display: flex; align-items: center; gap: 10px; padding: 12px; margin: 6px 0; border-radius: 14px; background: #171b28; border: 1px solid #242a3b; }
      .name { flex: 1; min-width: 0; font-size: 15px; }
      .msg { display: block; font-size: 12px; color: #f87171; margin-top: 2px; }
      button { font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 10px 14px; background: #343a4f; color: #f5f6fb; }
      button.on { background: linear-gradient(135deg, #6a63ff, #4f8bff); }
      button:disabled { opacity: .4; }
      input { font: inherit; width: 96px; padding: 9px; border-radius: 8px; border: 1px solid #343a4f; background: #0e111a; color: #f5f6fb; }
      .empty { margin-top: 32px; color: #8c93ab; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="game">JuiceBox Trainer</h1>
      <p id="status">Connecting…</p>
    </header>
    <main id="cheats"></main>
    <script src="/app.js"></script>
  </body>
</html>
